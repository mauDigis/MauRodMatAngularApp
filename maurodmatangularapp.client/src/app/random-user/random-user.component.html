
<div class="container">
  <div class="row">
    <h1 class="text-center display-3">RandomUser</h1>
    <div class="col-md-12 text-center mt-3">
      <table class="table" id="TablaDinamica">
        <thead>
          <tr>
            <th scope="col">Title First Last</th>
            <th scope="col">Gender</th>
            <th scope="col">State Country</th>
            <th scope="col">Email</th>
            <th scope="col">Date</th>
            <th scope="col">Phone</th>
            <th scope="col">Picture</th>
          </tr>
        </thead>
        <tbody>
          <!--Contenido Dinamico con mi peticion API GET-->
          <tr *ngIf="user">
            <td>
              <div >
                {{ user.name.title }} {{ user.name.first }} {{ user.name.last }}
              </div>
            </td>
            <td>
              {{ user.gender }}
            </td>
            <td>
              {{ user.location.state }} {{ user.location.country }}
            </td>
            <td>
              {{ user.email }}
            </td>
            <td>
              {{ user.dob.date }}
            </td>
            <td>
              {{ user.phone }}
            </td>
            <td>
              <!--Los corchetes indican una expresion de Angular-->
              <img [src]="user.picture.large" alt="Foto de perfil">
            </td>
          </tr>
        </tbody>
      </table>
      <button class="btn btn-outline-info text-center" (click)="ngOnInit()">Generar nuevo Usuario</button>
    </div>
  </div>
</div>
