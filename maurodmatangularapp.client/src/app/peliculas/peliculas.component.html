<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      display: flex; /* Habilita Flexbox */
      flex-direction: column; /* Organiza los elementos en una columna */
      min-height: 100vh; /* La altura mínima es el 100% del alto de la ventana */
      margin: 0; /* Elimina cualquier margen por defecto */
  </style>
</head>
<body>
  <div class="container">
    <div class="row">
      <h1 class="text-center display-3">Popular Movies</h1>
    </div>
    <div class="row justify-content-center mt-4">
      <div *ngFor="let pelicula of movies" class="col-md-3 mb-4">
        <div *ngIf="pelicula">
          <div class="card" style="width: 18rem;">
            <!--<span class="d-none"> {{ pelicula.id }} </span>-->
            <img [src]="'https://image.tmdb.org/t/p/w300' + pelicula.poster_path" class="card-img-top" alt="Pelicula">
            <div class="card-body">
              <h5 class="card-title"> {{pelicula.title}} </h5>
              <p class="card-text"> {{pelicula.overview}} </p>
            </div>
            <ul class="list-group list-group-flush">
              <li class="list-group-item">Calificación Promedio: {{pelicula.vote_average}} </li>
              <li class="list-group-item">Idioma: {{pelicula.original_language }} </li>
              <li class="list-group-item">Fecha Lanzamiento: {{pelicula.release_date}} </li>
            </ul>
            <div class="card-body">
              <button (click)="postFavMovie(pelicula)" class="btn btn-outline-warning">
                Agregar a Favoritos
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-star" viewBox="0 0 16 16">
                  <path d="M2.866 14.85c-.078.444.36.791.746.593l4.39-2.256 4.389 2.256c.386.198.824-.149.746-.592l-.83-4.73 3.522-3.356c.33-.314.16-.888-.282-.95l-4.898-.696L8.465.792a.513.513 0 0 0-.927 0L5.354 5.12l-4.898.696c-.441.062-.612.636-.283.95l3.523 3.356-.83 4.73zm4.905-2.767-3.686 1.894.694-3.957a.56.56 0 0 0-.163-.505L1.71 6.745l4.052-.576a.53.53 0 0 0 .393-.288L8 2.223l1.847 3.658a.53.53 0 0 0 .393.288l4.052.575-2.906 2.77a.56.56 0 0 0-.163.506l.694 3.957-3.686-1.894a.5.5 0 0 0-.461 0z" />
                </svg>
              </button>
                <a class="nav-link" routerLink="/peliculasfav">Ver mis Peliculas Fav</a>
            </div>
          </div>
        </div><!--Div *ngIf-->
      </div><!--Div *ngFor-->
    </div><!--Div row-->
  </div><!--Div container-->
</body>
</html>
